let sfxGain=null,musicGain=null,musicMode=false;
const outBus=()=>musicMode?musicGain:sfxGain;
function applyVolumes(){if(!ac)return;sfxGain.gain.value=save.sfxOff?0:1;musicGain.gain.value=save.musicOff?0:0.5;}
function ensureAudio(){if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)();sfxGain=ac.createGain();musicGain=ac.createGain();sfxGain.connect(ac.destination);musicGain.connect(ac.destination);applyVolumes();}catch(e){ac=null;}loadSounds();}if(ac){try{(muted||hidden||adPause||sdkMuted)?ac.suspend():ac.resume();}catch(e){}}}
function tone(f,d,type,v,slide){if(!ac||muted||hidden)return;const n=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,n);if(slide)o.frequency.exponentialRampToValueAtTime(f*slide,n+d);g.gain.setValueAtTime(.0001,n);g.gain.exponentialRampToValueAtTime(v,n+.01);g.gain.exponentialRampToValueAtTime(.0001,n+d);o.connect(g);g.connect(outBus());o.start(n);o.stop(n+d+.02);}
function noise(d,v,f){if(!ac||muted||hidden)return;const n=ac.currentTime,b=ac.createBuffer(1,Math.floor(ac.sampleRate*d),ac.sampleRate),a=b.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=(Math.random()*2-1)*(1-i/a.length);const s=ac.createBufferSource();s.buffer=b;const fl=ac.createBiquadFilter();fl.type='lowpass';fl.frequency.value=f||1800;const g=ac.createGain();g.gain.value=v;s.connect(fl);fl.connect(g);g.connect(outBus());s.start(n);}
// soft airy swish: band-passed noise with a smooth swell, no harsh click
function whoosh(d,v,f){if(!ac||muted||hidden)return;const n=ac.currentTime,b=ac.createBuffer(1,Math.floor(ac.sampleRate*d),ac.sampleRate),a=b.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=(Math.random()*2-1)*Math.sin(Math.PI*i/a.length);
  const s=ac.createBufferSource();s.buffer=b;const fl=ac.createBiquadFilter();fl.type='bandpass';fl.Q.value=1.1;fl.frequency.setValueAtTime(f,n);fl.frequency.exponentialRampToValueAtTime(f*1.8,n+d);const g=ac.createGain();g.gain.value=v;s.connect(fl);fl.connect(g);g.connect(outBus());s.start(n);}

function loadSounds(){if(sndLoading||!ac)return;sndLoading=true;
  for(const k in SND){sbuf[k]=[];SND[k].forEach((u,i)=>{try{const bin=atob(u.slice(u.indexOf(',')+1)),a=new Uint8Array(bin.length);for(let j=0;j<bin.length;j++)a[j]=bin.charCodeAt(j);
    const p=ac.decodeAudioData(a.buffer,b=>{sbuf[k][i]=b;},()=>{});if(p&&p.catch)p.catch(()=>{});}catch(e){}});}}
function ps(k,v,rate){if(!ac||muted||hidden)return false;const l=(sbuf[k]||[]).filter(Boolean);if(!l.length)return false;
  const s=ac.createBufferSource();s.buffer=l[Math.floor(Math.random()*l.length)];s.playbackRate.value=rate||1;const g=ac.createGain();g.gain.value=v;s.connect(g);g.connect(outBus());s.start();return true;}

// ================= drawing helpers (cartoon: flat fill + thick ink outline) =================
const LW=2.6;
function F(c,fill,lw){c.fillStyle=fill;c.fill();if(lw!==0){c.lineWidth=lw||LW;c.strokeStyle=OUT;c.lineJoin='round';c.lineCap='round';c.stroke();}}
function E(c,x,y,rx,ry,rot){c.beginPath();c.ellipse(x,y,rx,ry,rot||0,0,Math.PI*2);}
function RR(c,x,y,w,h,r){c.beginPath();c.roundRect?c.roundRect(x,y,w,h,r):c.rect(x,y,w,h);}
function eye(c,x,y,r,look,pupil,white){E(c,x,y,r,r*1.15);F(c,white||'#fff',1.8);E(c,x+look*r*.35,y+r*.1,r*.5,r*.6);c.fillStyle=pupil||OUT;c.fill();E(c,x+look*r*.35-r*.15,y-r*.15,r*.16,r*.16);c.fillStyle='#fff';c.fill();}

function drawHero(c){

  c.beginPath();c.moveTo(-6,-4);c.quadraticCurveTo(-20,6,-16,20);c.lineTo(-4,18);c.closePath();F(c,'#a4222a');

  RR(c,-9,10,8,10,3);F(c,'#6b3d24');RR(c,2,10,8,10,3);F(c,'#6b3d24');

  c.beginPath();c.moveTo(0,-7);c.lineTo(0,15);c.lineWidth=2;c.strokeStyle='#a8282a';c.stroke();
  RR(c,-13,6,26,5,2);F(c,'#ffc83a',2);

}

let tiles=[];const TILE=256,GT=768;let groundPat=null;
function rnd(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296;};}
function buildGround(){
  // one large seamless texture, drawn as a repeating pattern: no tile borders at all
  const L=curLoc();tiles=[];{const v=0,T=GT;
    const px0=Math.round(T*Math.min(K,2));const c=document.createElement('canvas');c.width=c.height=px0;const x=c.getContext('2d');x.scale(px0/T,px0/T);
    x.fillStyle=L.ground;x.fillRect(0,0,T,T);
    const r=rnd(97+v*31);
    const wrap=(fn)=>{for(const ox of [-T,0,T])for(const oy of [-T,0,T]){x.save();x.translate(ox,oy);fn();x.restore();}}; // seamless edges
    const TILE=T,M=9;
    for(let i=0;i<18*M;i++){const px=r()*TILE,py=r()*TILE,rx=14+r()*20,ry=8+r()*10;wrap(()=>{x.fillStyle='rgba(255,255,255,.06)';E(x,px,py,rx,ry);x.fill();});}
    for(let i=0;i<26*M;i++){const px=r()*TILE,py=r()*TILE;wrap(()=>{x.strokeStyle=L.tuft;x.lineWidth=2;x.lineCap='round';x.beginPath();x.moveTo(px,py);x.lineTo(px-3,py-7);x.moveTo(px+2,py);x.lineTo(px+3,py-8);x.moveTo(px+4,py);x.lineTo(px+8,py-6);x.stroke();});}
    for(let i=0;i<5*M;i++){const px=r()*TILE,py=r()*TILE,col=L.flowers[Math.floor(r()*L.flowers.length)];
      wrap(()=>{for(let p=0;p<5;p++){const a=p*Math.PI*2/5;E(x,px+Math.cos(a)*3,py+Math.sin(a)*3,2.4,2.4);x.fillStyle=col;x.fill();}E(x,px,py,1.6,1.6);x.fillStyle='#e09a12';x.fill();});}
    tiles.push(c);groundPat=null;
  }
  // decor sprites
  decorSpr=[];
  for(const fn of L.decor.map(k=>DECOR[k])){
    const c=document.createElement('canvas');c.width=c.height=Math.ceil(60*K);const x=c.getContext('2d');x.scale(K,K);x.translate(30,34);fn(x);decorSpr.push(c);
  }
}

// ================= spatial grid =================
const CELL=64;let grid=new Map();
function gk(cx,cy){return (cx+30000)*65536+(cy+30000);}
function buildGrid(){grid.clear();for(const e of enemies){if(e.dead)continue;const k=gk(Math.floor(e.x/CELL),Math.floor(e.y/CELL));let a=grid.get(k);if(!a){a=[];grid.set(k,a);}a.push(e);}}
function near(x,y,r,cb){const x0=Math.floor((x-r)/CELL),x1=Math.floor((x+r)/CELL),y0=Math.floor((y-r)/CELL),y1=Math.floor((y+r)/CELL);
  for(let cx=x0;cx<=x1;cx++)for(let cy=y0;cy<=y1;cy++){const a=grid.get(gk(cx,cy));if(a)for(const e of a)if(!e.dead)cb(e);}}
const viewR=()=>Math.hypot(W,H)/S*0.55+40;

  const e={type,x,y,r:d.r*(opt.elite?1.3:1),hp:d.hp*hm,maxHp:d.hp*hm,spd:d.spd*(0.9+Math.random()*0.2)*(opt.elite?0.9:1)*(MOD('swift')?1.25:1),dmg:d.dmg*(1+time/500)*(opt.elite?1.5:1)*(EN[type].hpFixed?1:curLoc().dmg)*curDiff().dmg,xp:d.xp*(opt.elite?6:1),
    face:1,flash:0,kx:0,ky:0,slow:0,frozen:0,walk:Math.random()*6,dead:false,hitCd:{},elite:!!opt.elite,shootT:1+Math.random()*2};
  if(type==='crow'&&time>3)sfx.crow();

function spawnAround(type,opt){const a=Math.random()*Math.PI*2,R=viewR();return spawnEnemy(type,hero.x+Math.cos(a)*R,hero.y+Math.sin(a)*R,opt);}
function pickType(){
  const w=[];for(const [k,from,early,late] of curLoc().mix)if(time>=from)w.push([k,time>180?late:early]);
  let sum=0;for(const [,v] of w)sum+=v;let r=Math.random()*sum;for(const [k,v] of w){r-=v;if(r<=0)return k;}return 'ghoul';
}
function director(dt){
  const rate=Math.min(endless?Math.min(34,22+(time-RUN_BOSS)/25):bossSpawned?22:15,1.0+time/14+(boss&&!boss.dead?boss.age/12:0))*(MOD('horde')?1.5:MOD('giants')?0.6:1);
  spawnAcc+=rate*dt;
  while(spawnAcc>=1){spawnAcc--;if(enemies.length<340)spawnAround(pickType());}
  for(const wt of [60,120,180,235]){if(time>=wt&&!waveDone[wt]){waveDone[wt]=true;const L=curLoc(),type=wt<120?L.waves[0]:wt<200?L.waves[1]:L.waves[2],n=wt<200?30:22,R=viewR()*1.05;
    for(let i=0;i<n;i++){const a=i/n*Math.PI*2;spawnEnemy(type,hero.x+Math.cos(a)*R,hero.y+Math.sin(a)*R);}}}

const MINI_SHOT={forest:'mud',swamp:'bubble',winter:'bubble',road:'gust'},BOSS_ATK={forest:'k_att',swamp:'v_att',winter:'g_att',road:'k_att'};
function setWarn(txt){const w=$('warn');w.textContent=txt;w.hidden=!txt;}
function miniName(){const L=curLoc();return (t('minis')[L.id]||'');}
function spawnMini(){const L=curLoc();mini=spawnAround(L.mini,{elite:true});mini.mini=true;mini.r=EN[L.mini].r*1.9;
  mini.maxHp=mini.hp=1600*(1+(L.hp-1)*0.6)*curDiff().hp*(MOD('giants')?1.6:1);mini.dmg*=1.25;mini.spd=EN[L.mini].spd*1.05;mini.boneT=3;mini.xp=40;
  $('bossName').textContent=miniName();$('bossbar').classList.add('on','mini');showHint(t('miniCome').replace('%',miniName()),2800);sfx.boss();shake=0.8;}
function spawnBoss(hpMul){

}
function enemyShoot(e,kind,a,sp,dmg){eshots.push({k:kind,x:e.x,y:e.y-6,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:4,dmg:dmg*(e.isBoss?1:1),r:kind==='bone'?7:kind==='fire'?7:6,rot:0});}
function updateEnemies(dt){
  for(const e of enemies){
    if(e.dead)continue;
    const dx=hero.x-e.x,dy=hero.y-e.y,d=Math.hypot(dx,dy)||1;
    let sp=e.spd*(e.slow>0?0.5:1);if(e.frozen>0)sp=0;
    let mx=dx/d,my=dy/d;
    if(EN[e.type].ranged){ // keep distance and throw mud
      if(d<170){mx=-mx;my=-my;}else if(d<240){const tx=-my,ty=mx;mx=tx*0.8;my=ty*0.8;}
      e.shootT-=dt;if(e.shootT<=0&&d<300&&e.frozen<=0){e.shootT=2.8;enemyShoot(e,'mud',Math.atan2(dy,dx),160,e.dmg*0.85);}
    }
    if(e.mini&&e.frozen<=0){e.boneT-=dt;if(e.boneT<=0){e.boneT=4.2;const k=MINI_SHOT[curLoc().id]||'mud',off=Math.random()*6;for(let i=0;i<10;i++)enemyShoot(e,k,off+i/10*Math.PI*2,125,e.dmg*0.4);ps(BOSS_ATK[curLoc().id],.3,1.25);}}
    if(e.isBoss){
      e.age+=dt;if(!e.p2&&e.hp<e.maxHp*0.5){e.p2=true;e.summonT=0;e.dashT=0.5;shake=1;flashT=0.25;burstFx(e.x,e.y,'#ff4a3a',50,340);fx.push({k:'ring',x:e.x,y:e.y,t:0,life:0.5,R:140,c:'#ff4a3a'});sfx.boss();showHint(t('bossRage').replace('%',bossName()),2600);}
      const rage=(1+Math.min(1.5,e.age/60*0.35))*(e.p2?1.3:1); // stronger every minute of the fight
      sp*=rage;
      if(d>260){e.farT+=dt;if(e.farT>1.5){e.hp=Math.min(e.maxHp,e.hp+e.maxHp*0.03*dt);e.regenNumT-=dt;if(e.regenNumT<=0){e.regenNumT=0.5;nums.push({x:e.x,y:e.y-e.r-10,v:'+'+Math.round(e.maxHp*0.015),t:0,heal:true});}
        if(!e.toldRegen){e.toldRegen=true;showHint(t('bossRegen'),3200);}}}else e.farT=0;
      e.summonT-=dt*rage;e.dashT-=dt*rage;e.boneT-=dt*rage;
      const L=curLoc();
      if(e.summonT<=0){e.summonT=7;for(let i=0;i<10&&enemies.length<380;i++){const a=i/10*Math.PI*2;spawnEnemy(L.summon,e.x+Math.cos(a)*60,e.y+Math.sin(a)*60,{hpMul:1.2});}burstFx(e.x,e.y,EN[e.type].col,24,220);}
      if(L.pattern==='ring'&&e.boneT<=0){e.boneT=4.2;sfx.bossAtk('k_att');const off=Math.random()*Math.PI;for(let i=0;i<12;i++)enemyShoot(e,'bone',off+i/12*Math.PI*2,150,12);}
      if(L.pattern==='spiral'){if(e.boneT<=0){e.boneT=5;e.spiral=2.2;sfx.bossAtk('v_att');setTimeout(()=>{if(state==='play')sfx.bossAtk('v_att');},700);e.spA=Math.random()*6;}if(e.spiral>0){e.spiral-=dt;e.spT=(e.spT||0)-dt;if(e.spT<=0){e.spT=0.11;e.spA+=0.55;enemyShoot(e,'bubble',e.spA,130,11);enemyShoot(e,'bubble',e.spA+Math.PI,130,11);}}}
      if(L.pattern==='whistle'&&e.boneT<=0){e.boneT=3.6;e.wh=(e.wh||0)+1;const off=Math.random();for(let i=0;i<18;i++)enemyShoot(e,'gust',off+i/18*Math.PI*2,150+(e.wh%2)*40,12);sfx.whistle();}
      if(L.pattern==='fan'&&e.boneT<=0){e.boneT=3.2;sfx.bossAtk('g_att');const a0=Math.atan2(dy,dx);for(let h=-1;h<=1;h++)for(let i=-2;i<=2;i++)enemyShoot(e,'fire',a0+h*0.5+i*0.09,190+Math.abs(i)*10,13);}
      if(e.dashT<=0){e.dashT=5;e.dash=0.55;}
      if(e.dash>0){e.dash-=dt;sp*=3.6;}
    }
    e.x+=(mx*sp+e.kx)*dt;e.y+=(my*sp+e.ky)*dt;
    e.kx*=Math.pow(0.0008,dt);e.ky*=Math.pow(0.0008,dt);
    if(Math.abs(dx)>2)e.face=dx>0?1:-1;
    if(e.frozen<=0)e.walk+=dt*(8+sp*0.03);
    if(e.flash>0)e.flash-=dt;if(e.slow>0)e.slow-=dt;if(e.frozen>0)e.frozen-=dt;
    if(d>viewR()*2&&!e.isBoss){const a=Math.atan2(dy,dx)+Math.PI+(Math.random()-0.5);const R=viewR()-10;e.x=hero.x-Math.cos(a)*R;e.y=hero.y-Math.sin(a)*R;}
  }
  buildGrid();
  for(const e of enemies){if(e.dead||e.isBoss)continue;
    near(e.x,e.y,e.r*2,o=>{if(o===e)return;const dx=e.x-o.x,dy=e.y-o.y,rr=e.r+o.r,d2=dx*dx+dy*dy;if(d2<rr*rr&&d2>0.01){const d=Math.sqrt(d2),p=(rr-d)*0.5;e.x+=dx/d*p;e.y+=dy/d*p;}});}
  if(hero.inv<=0){
    let sum=0,n=0,sx=0,sy=0;near(hero.x,hero.y,HERO_R+60,e=>{if(e.dead||e.frozen>0)return;if(e.touchT>0){e.touchT-=dt;}if(!(e.touchT>0)&&Math.hypot(e.x-hero.x,e.y-hero.y)<e.r+HERO_R-3){e.touchT=1.0;sum+=n<4?e.dmg:e.dmg*0.35;n++;sx=e.x;sy=e.y;}});
    if(n)hurtHero(sum,sx,sy,true);
  }
}
function hurtHero(dmg,sx,sy,contact){
  if(heroDef.talent==='shield'&&hero.block>=8){hero.block=0;hero.inv=0.4;burstFx(hero.x,hero.y-8,'#ffe27a',16,200);fx.push({k:'ring',x:hero.x,y:hero.y-8,t:0,life:0.3,R:40,c:'#ffe27a'});sfx.block();return;}
  if(buffs.shield>0){hero.inv=0.25;near(hero.x,hero.y,70,e=>{const ex=e.x-hero.x,ey=e.y-hero.y,ed=Math.hypot(ex,ey)||1;if(!e.isBoss){e.kx+=ex/ed*320;e.ky+=ey/ed*320;}});return;}
  hero.hp-=dmg*stats.taken;hero.inv=contact?0.12:0.5;shake=Math.min(1,shake+(contact?0.25:0.4));if(hurtSfxT<=0){hurtSfxT=0.28;sfx.hurt();}
  if(!contact)near(hero.x,hero.y,50,e=>{const ex=e.x-hero.x,ey=e.y-hero.y,ed=Math.hypot(ex,ey)||1;if(!e.isBoss){e.kx+=ex/ed*140;e.ky+=ey/ed*140;}});
  if(hero.hp<=0&&heroDef.talent==='second'&&!hero.second){hero.second=true;hero.hp=hero.maxHp*0.5;hero.inv=2.5;near(hero.x,hero.y,160,e=>{const ex=e.x-hero.x,ey=e.y-hero.y,ed=Math.hypot(ex,ey)||1;if(!e.isBoss){e.kx+=ex/ed*600;e.ky+=ey/ed*600;}});burstFx(hero.x,hero.y,'#ffd84a',40,300);sfx.second();showHint(t('secondWind'),2200);return;}
  if(hero.hp<=0){hero.hp=0;die();}
}
function updateEshots(dt){
  for(const s of eshots){s.x+=s.vx*dt;s.y+=s.vy*dt;s.life-=dt;s.rot+=dt*8;
    if(hero.inv<=0&&Math.hypot(s.x-hero.x,s.y-(hero.y-6))<s.r+HERO_R-2){s.life=0;burstFx(s.x,s.y,s.k==='mud'?'#7a5a32':'#e8e2d0',8,120);if(s.k==='gust'){const d=Math.hypot(s.vx,s.vy)||1;hero.x+=s.vx/d*26;hero.y+=s.vy/d*26;}hurtHero(s.dmg,s.x,s.y);}}
  eshots=eshots.filter(s=>s.life>0);
}
function damage(e,amount,kx,ky,kb){
  if(e.dead)return;
  const crit=Math.random()<stats.crit;amount=Math.round(amount*stats.dmg*(0.9+Math.random()*0.2)*(crit?2:1));
  e.hp-=amount;e.flash=0.09;if(crit)sfx.crit();if(heroDef.talent==='chill'&&!e.isBoss)e.slow=Math.max(e.slow,1.2);
  if(!e.isBoss&&kb){const m=e.mini?0.06:e.elite?0.35:1;e.kx+=kx*kb*m;e.ky+=ky*kb*m;}
  if(nums.length<36&&(crit||amount>=30||e.isBoss||e.elite||Math.random()<0.3))nums.push({x:e.x+(Math.random()-0.5)*10,y:e.y-e.r-6,v:amount,t:0,crit:crit||amount>=45}); // fewer numbers keep the screen readable

  if(e.hp<=0)kill(e);
}
function kill(e){

  if(e.elite){gems.push({x:e.x,y:e.y,chest:true,v:0});gems.push({x:e.x+26,y:e.y,buff:pickBuff(),v:0});coinsRun+=8;}

// ================= weapons =================
const W_SWORD={R:[78,86,86,98,104],dm:[20,24,24,30,36],half:[0.95,1.1,1.1,1.25,Math.PI]};
const W_OB={n:[2,3,3,4,5],R:[60,64,76,80,86],dm:[8,9,12,13,15]};
const W_KOLO={R:[60,70,70,84,100],dm:[4,5,7,8,10]};
const W_AXE={n:[1,1,2,2,3],dm:[16,20,22,28,32],range:[150,160,170,200,210],cd:[1.7,1.6,1.5,1.4,1.3]};
const W_FROST={n:[3,4,4,6,6],dm:[11,12,14,15,17],cd:[1.5,1.45,1.35,1.3,1.2]};
const W_SONG={R:[120,145,150,175,185],dm:[14,16,19,22,26],cd:[2.8,2.6,2.4,2.3,2.2]};
function weapons(dt){
  for(const w of WEAPONS){const lv=lvOf(w);if(!lv)continue;cool[w]-=dt;if(cool[w]>0)continue;
    if(w==='sword'){cool[w]=1.05*stats.cd;fireSword(lv);}
    else if(w==='feather'){cool[w]=[1.1,1.0,0.95,0.9,0.8][lv-1]*stats.cd;fireFeather(lv);}
    else if(w==='perun'){cool[w]=[2.4,2.2,1.9,1.8,1.6][lv-1]*stats.cd;firePerun(lv);}
    else if(w==='axe'){cool[w]=W_AXE.cd[lv-1]*stats.cd;fireAxe(lv);}
    else if(w==='frost'){cool[w]=W_FROST.cd[lv-1]*stats.cd;fireFrost(lv);}
    else if(w==='arrows'){cool[w]=[0.9,0.85,0.8,0.75,0.7][lv-1]*stats.cd;fireArrows(lv);}
    else if(w==='song'){cool[w]=W_SONG.cd[lv-1]*stats.cd;fireSong(lv);if(lv>=5)setTimeout(()=>{if(state==='play'&&!paused&&hero)fireSong(lv,true);},350);}
  }
  const ol=lvOf('obereg');
  if(ol){orbAng+=dt*3.4;const ev=evo.obereg;const n=ev?7:W_OB.n[ol-1],R=(ev?98:W_OB.R[ol-1])*stats.area,dm=W_OB.dm[ol-1]*(ev?1.5:1);
    for(let i=0;i<n;i++){const a=orbAng+i/n*Math.PI*2,x=hero.x+Math.cos(a)*R,y=hero.y+Math.sin(a)*R;
      if(ev)for(const s of eshots)if(Math.hypot(s.x-x,s.y-y)<16){s.life=0;burstFx(s.x,s.y,'#ffc83a',4,80);}
      near(x,y,40,e=>{if(Math.hypot(e.x-x,e.y-y)<e.r+11){const k='o'+i;if(!e.hitCd[k]||e.hitCd[k]<time){e.hitCd[k]=time+0.45;const dx=e.x-hero.x,dy=e.y-hero.y,d=Math.hypot(dx,dy)||1;damage(e,dm,dx/d,dy/d,160);sfx.charm();}}});}}
  const kl=lvOf('kolo');
  if(kl){auraT-=dt;const ev=evo.kolo;const R=koloR(kl);
    near(hero.x,hero.y,R+30,e=>{if(Math.hypot(e.x-hero.x,e.y-hero.y)<R+e.r*0.5)e.slow=Math.max(e.slow,0.25);});
    if(auraT<=0){auraT=0.4;const dm=W_KOLO.dm[kl-1]*(ev?2.2:1);near(hero.x,hero.y,R+30,e=>{if(Math.hypot(e.x-hero.x,e.y-hero.y)<R+e.r*0.5)damage(e,dm,0,0,0);});}}
  // koloboks: rolling buns that bounce off the screen edges
  const kb=lvOf('kolobok');
  if(kb){const ev=evo.kolobok,n=ev?4:[1,1,2,2,3][kb-1],sp=[230,250,250,270,290][kb-1]*(ev?1.15:1),r=(ev?20:13)*stats.area,dm=[12,15,16,19,22][kb-1]*(ev?1.6:1);
    while(kolobs.length<n)kolobs.push({x:hero.x,y:hero.y,a:Math.random()*Math.PI*2,rot:0,hit:new Map()});
    const hw=W/S/2-r,hh=H/S/2-r;
    for(const k of kolobs){k.r=r;k.x+=Math.cos(k.a)*sp*dt;k.y+=Math.sin(k.a)*sp*dt;k.rot+=dt*sp/r;
      if(k.x<hero.x-hw){k.x=hero.x-hw;k.a=Math.PI-k.a;}if(k.x>hero.x+hw){k.x=hero.x+hw;k.a=Math.PI-k.a;}
      if(k.y<hero.y-hh){k.y=hero.y-hh;k.a=-k.a;}if(k.y>hero.y+hh){k.y=hero.y+hh;k.a=-k.a;}
      near(k.x,k.y,r+40,e=>{const dx=e.x-k.x,dy=e.y-k.y,d=Math.hypot(dx,dy)||1;if(d<e.r+r){const last=k.hit.get(e)||-9;if(time-last>0.45){k.hit.set(e,time);damage(e,dm,dx/d,dy/d,ev?260:180);sfx.kolobok();}}});}}
  // expanding song waves
  for(const wv of waves){wv.t+=dt;const r=wv.R*Math.min(1,wv.t/wv.life);
    near(wv.x,wv.y,r+30,e=>{if(wv.hit.has(e))return;const d=Math.hypot(e.x-wv.x,e.y-wv.y);if(d<r+e.r&&d>r-26-e.r){wv.hit.add(e);damage(e,wv.dm,(e.x-wv.x)/(d||1),(e.y-wv.y)/(d||1),wv.col?120:340);if(wv.sleep&&!e.isBoss)e.frozen=Math.max(e.frozen,1.3);}});}
  waves=waves.filter(w=>w.t<w.life);
}
function koloR(kl){return W_KOLO.R[kl-1]*(evo.kolo?1.4:1)*stats.area*(heroDef.talent==='witch'?1.2:1);}
function fireSword(lv){
  const ev=evo.sword;const R=W_SWORD.R[lv-1]*(ev?1.3:1)*stats.area,dm=W_SWORD.dm[lv-1]*(ev?1.8:1),half=W_SWORD.half[lv-1];
  if(ev)waves.push({x:hero.x,y:hero.y,R:R*2.4,t:0,life:0.5,dm:dm*0.5,hit:new Set(),col:'light'});
  const tg=nearestEnemy(hero.x,hero.y,R+90);const base=tg?Math.atan2(tg.y-hero.y,tg.x-hero.x):hero.aim;
  if(tg&&Math.abs(tg.x-hero.x)>4)hero.face=tg.x>hero.x?1:-1;
  const dirs=half>=Math.PI?[0]:lv>=3?[0,Math.PI]:[0];
  dirs.forEach((off,i)=>{const a=base+off;
    fx.push({k:'slash',a,half,R,t:-i*0.1,life:0.28,dir:(i%2?-1:1)});
    near(hero.x,hero.y,R+40,e=>{const dx=e.x-hero.x,dy=e.y-hero.y,d=Math.hypot(dx,dy);if(d>R+e.r)return;let da=Math.atan2(dy,dx)-a;da=Math.atan2(Math.sin(da),Math.cos(da));if(Math.abs(da)<=half+0.15||half>=Math.PI)damage(e,dm,dx/(d||1),dy/(d||1),220);});
  });
  sfx.slash();
}

function updateShots(dt){
  for(const s of shots){
    if(s.k==='feather'){
      if(!s.target||s.target.dead)s.target=nearestEnemy(s.x,s.y,300,s.hit);
      if(s.target){const a=Math.atan2(s.target.y-s.y,s.target.x-s.x),cur=Math.atan2(s.vy,s.vx);let da=Math.atan2(Math.sin(a-cur),Math.cos(a-cur));const na=cur+Math.max(-5*dt,Math.min(5*dt,da));s.vx=Math.cos(na)*360;s.vy=Math.sin(na)*360;}
      s.x+=s.vx*dt;s.y+=s.vy*dt;s.life-=dt;s.trail-=dt;
      if(s.trail<=0){s.trail=0.02;fx.push({k:'p',x:s.x,y:s.y,vx:(Math.random()-0.5)*30,vy:(Math.random()-0.5)*30,t:0,life:0.35,c:Math.random()<0.5?'#ffe14a':'#ff8a1f',r:3+Math.random()*2});}
      near(s.x,s.y,40,e=>{if(s.life<=0||s.hit.has(e))return;if(Math.hypot(e.x-s.x,e.y-s.y)<e.r+7){s.hit.add(e);const d=Math.hypot(s.vx,s.vy);damage(e,s.dmg,s.vx/d,s.vy/d,120);burstFx(s.x,s.y,'#ff8a1f',6,120);
        if(s.boom){const bx=s.x,by=s.y;near(bx,by,70,o=>{if(o!==e&&Math.hypot(o.x-bx,o.y-by)<46+o.r*0.5)damage(o,s.dmg*0.6,0,0,0);});fx.push({k:'ring',x:bx,y:by,t:0,life:0.25,R:46,c:'#ff8a1f'});}s.pierce--;if(s.pierce<=0)s.life=0;s.target=null;}});
    } else if(s.k==='axe'){
      s.rot+=dt*14;s.life-=dt;
      if(!s.back){s.x+=s.vx*dt;s.y+=s.vy*dt;s.dist+=Math.hypot(s.vx,s.vy)*dt;if(s.dist>=s.range)s.back=true;}
      else{const dx=hero.x-s.x,dy=hero.y-s.y,d=Math.hypot(dx,dy)||1;s.x+=dx/d*380*dt;s.y+=dy/d*380*dt;if(d<20)s.life=0;}
      near(s.x,s.y,60,e=>{if(Math.hypot(e.x-s.x,e.y-s.y)<e.r+14*s.big){const last=s.hitT.get(e)||-9;if(time-last>0.35){s.hitT.set(e,time);const dx=e.x-s.x,dy=e.y-s.y,d=Math.hypot(dx,dy)||1;damage(e,s.dmg,dx/d,dy/d,150);}}});
    } else if(s.k==='arrow'){
      s.x+=s.vx*dt;s.y+=s.vy*dt;s.life-=dt;
      near(s.x,s.y,36,e=>{if(s.life<=0||s.hit.has(e))return;if(Math.hypot(e.x-s.x,e.y-s.y)<e.r+5){s.hit.add(e);const d=Math.hypot(s.vx,s.vy);damage(e,s.dmg,s.vx/d,s.vy/d,90);s.pierce--;if(s.pierce<=0)s.life=0;}});
    } else if(s.k==='ice'){
      s.x+=s.vx*dt;s.y+=s.vy*dt;s.life-=dt;
      near(s.x,s.y,36,e=>{if(s.life<=0||s.hit.has(e))return;if(Math.hypot(e.x-s.x,e.y-s.y)<e.r+6){s.hit.add(e);const d=Math.hypot(s.vx,s.vy);damage(e,s.dmg,s.vx/d,s.vy/d,60);e.slow=Math.max(e.slow,1.6);if(s.freeze&&!e.isBoss)e.frozen=Math.max(e.frozen,1.1);burstFx(s.x,s.y,'#d8f3ff',5,90);s.life=0;}});
    }
  }
  shots=shots.filter(s=>s.life>0);
}

function updateGems(dt){
  for(const g of gems){
    const dx=hero.x-g.x,dy=hero.y-g.y,d=Math.hypot(dx,dy);
    if(d<stats.magnet*(g.chest?2.2:1)||g.pull){g.pull=true;const sp=Math.max(220,600-d);g.x+=dx/(d||1)*sp*dt;g.y+=dy/(d||1)*sp*dt;}
    if(d<HERO_R+8){g.got=true;
      if(g.coin){coinsRun++;sfx.coin();}
      else if(g.pie){hero.hp=Math.min(hero.maxHp,hero.hp+30);sfx.heal();nums.push({x:hero.x,y:hero.y-30,v:'+30',t:0,heal:true});}
      else if(g.buff){applyBuff(g.buff);}
      else if(g.chest){const ev=evoReady();if(ev){evo[ev]=true;save.st.evos[ev]=true;refreshGear();showHint(t('evo')+EVOS[ev][lang][0]+' — '+EVOS[ev][lang][1],3800);sfx.evo();shake=0.6;burstFx(hero.x,hero.y,'#fff6a0',60,320);}else{lvlQueue++;sfx.chest();showHint(t('chest'),2000);}burstFx(hero.x,hero.y,'#ffc83a',30,240);}
      else{hero.xp+=(g.v+xpBank)*stats.xp;xpBank=0;sfx.gem();while(hero.xp>=hero.xpNext){hero.xp-=hero.xpNext;hero.level++;hero.xpNext=Math.round(3+hero.level*2.2+Math.pow(hero.level,1.55));lvlQueue++;fx.push({k:'ring',x:hero.x,y:hero.y,t:0,life:0.45,R:90,c:'#ffe27a'});burstFx(hero.x,hero.y,'#ffd84a',26,260);}}}
  }
  gems=gems.filter(g=>!g.got);
  if(gems.length>500){let over=gems.length-500;gems=gems.filter(g=>{if(over>0&&!g.coin&&!g.pie&&!g.chest&&!g.buff&&!g.pull){over--;xpBank+=g.v;return false;}return true;});}
  if(lvlQueue>0&&state==='play'&&!paused)openLevelUp();
}
function applyBuff(k){
  const n=t('buffN')[k];showHint(n[0]+' — '+n[1],2200);burstFx(hero.x,hero.y,BUFFS[k].col,24,220);
  if(k==='shield')sfx.shield();else if(k==='freeze')sfx.freeze();else if(k!=='bomb')sfx.buff();
  if(k==='magnet'){for(const g of gems)if(!g.buff)g.pull=true;}
  else if(k==='freeze'){for(const e of enemies)if(!e.dead)e.frozen=Math.max(e.frozen,e.isBoss||e.mini?2.5:5);eshots=[];}
  else if(k==='bomb'){flashT=0.35;shake=1;sfx.thunder();const vw=W/S/2+30,vh=H/S/2+30;
    for(const e of enemies.slice()){if(e.dead||Math.abs(e.x-hero.x)>vw||Math.abs(e.y-hero.y)>vh)continue;if(e.isBoss||e.mini)damage(e,e.maxHp*0.06/stats.dmg,0,0,0);else if(e.elite)damage(e,e.maxHp*0.5/stats.dmg,0,0,0);else kill(e);}eshots=[];}
  else{buffs[k]=BUFFS[k].d;recalc();}
}
function evoReady(){for(const w of WEAPONS){const e=EVOS[w];if(e&&lvOf(w)>=5&&lvOf(e.p)>0&&!evo[w])return w;}return null;}
function optionPool(){
  const ws=WEAPONS.filter(w=>lvOf(w)>0).length;const pool=[];
  for(const w of WEAPONS){const l=lvOf(w);if(l<5&&(l>0||ws<MAX_WEAPONS))pool.push(w);}
  for(const p of PASSIVES)if(lvOf(p)<maxLv(p))pool.push(p);
  return pool;
}
function rollOptions(){
  const pool=optionPool();const opts=[];
  // owned items that can still grow are offered a bit more often, so builds can reach level 5
  const weighted=[];for(const id of pool){weighted.push(id);if(lvOf(id)>0)weighted.push(id);}
  const want=heroDef.talent==='wise'?4:3;
  while(opts.length<want&&weighted.length){const id=weighted[Math.floor(Math.random()*weighted.length)];opts.push(id);for(let i=weighted.length-1;i>=0;i--)if(weighted[i]===id)weighted.splice(i,1);}
  if(opts.length<3){opts.push('heal');if(opts.length<3)opts.push('bag');}
  return opts;
}

function pipsHtml(cur,max,next){let h='<span class="pips">';for(let i=1;i<=max;i++)h+='<i class="'+(i<=cur?'on':(next&&i===cur+1)?'nx':'')+'"></i>';return h+'</span>';}

      const pair=WEAPONS.includes(id)?(EVOS[id]&&UP[EVOS[id].p][lang][0]):(Object.keys(EVOS).find(w=>EVOS[w].p===id));
      if(pair)desc+=' · ⇄ '+(WEAPONS.includes(id)?pair:UP[pair][lang][0]);
      badge=cur===0?'<span class="lv new"></span>':'';pips=pipsHtml(cur,maxLv(id),true);}

function choose(id){
  if(state!=='lvlup')return;
  if(id==='heal')hero.hp=Math.min(hero.maxHp,hero.hp+40);
  else if(id==='bag')coinsRun+=25;
  else{if(lvOf(id)>=maxLv(id))return;owned[id]=(owned[id]||0)+1;if(PASSIVES.includes(id))recalc();if(WEAPONS.includes(id)&&owned[id]===1)cool[id]=0.2;}
  if(WEAPONS.filter(w=>lvOf(w)>0).length>=5)save.st.arsenal=true;
  $('lvlup').hidden=true;state='play';refreshGear();
  if(lvlQueue>0)setTimeout(()=>{if(state==='play')openLevelUp();},150);
}

let lowQ=false,slowT=0,emaDt=1/60;
function burstFx(x,y,col,n,sp){if(lowQ)n=Math.ceil(n/3);for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=sp*(0.4+Math.random()*0.8);fx.push({k:'p',x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,t:0,life:0.35+Math.random()*0.3,c:Math.random()<0.25?'#fff':col,r:2+Math.random()*3});}}
function updateFx(dt){
  for(const f of fx){f.t+=dt;if(f.k==='p'){f.x+=f.vx*dt;f.y+=f.vy*dt;f.vx*=Math.pow(0.02,dt);f.vy*=Math.pow(0.02,dt);}}
  fx=fx.filter(f=>f.t<f.life);const cap=lowQ?250:900;if(fx.length>cap)fx.splice(0,fx.length-cap);
  for(const n of nums)n.t+=dt;nums=nums.filter(n=>n.t<0.7);

// ================= hero =================
const input={active:false,ox:0,oy:0,px:0,py:0};const keys={};
function updateHero(dt){
  let mx=0,my=0;
  if(keys.left)mx--;if(keys.right)mx++;if(keys.up)my--;if(keys.down)my++;
  if(input.active){const dx=input.px-input.ox,dy=input.py-input.oy,d=Math.hypot(dx,dy);if(d>6){mx=dx/d*Math.min(1,d/40);my=dy/d*Math.min(1,d/40);}}
  const m=Math.hypot(mx,my);if(m>1){mx/=m;my/=m;}
  hero.moving=m>0.05;
  if(hero.moving){hero.x+=mx*stats.speed*dt;hero.y+=my*stats.speed*dt;hero.aim=Math.atan2(my,mx);if(Math.abs(mx)>0.1)hero.face=mx>0?1:-1;hero.walk+=dt*12;}
  if(hero.inv>0)hero.inv-=dt;hero.block=(hero.block||0)+dt;
  hero.minHp=Math.min(hero.minHp==null?999:hero.minHp,hero.hp);if(stats.regen>0)hero.hp=Math.min(hero.maxHp,hero.hp+stats.regen*dt);
}

// ---- drifting atmosphere: leaves in the forest, fireflies on the swamp, snow in winter ----
let amb=[];

  function verify(p){return Promise.resolve(p.getSignedData()).then(function(sd){
      return fetch(VERIFY,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({signedData:sd})});})
    .then(function(r){return r.json();}).then(function(j){return !!(j&&j.ok&&j.productId===p.productId);}).catch(function(){return false;});}
  function store(sdk){
    var off={isAvailable:false,products:[],has:function(){return false;},purchase:function(){return Promise.reject();}};
    var st=sdk.store;if(!VERIFY||VERIFY.indexOf('http')!==0||!st||!window.fetch)return Promise.resolve(off);
    var owned={},pay={isAvailable:false,products:[],has:function(t){return !!owned[t];},
      purchase:function(o){return Promise.resolve(st.purchase({productId:o.tag})).then(function(r){
          if(!r||!r.success)throw new Error(r&&r.reason||'fail');
          return verify(r.purchase).then(function(ok){if(!ok)throw new Error('verify');owned[o.tag]=true;return true;});});}};
    var work=Promise.resolve(st.getProducts()).then(function(list){
        pay.products=(list||[]).map(function(x){return {tag:x.id,price:Math.round(x.price/100),currencySymbol:'₽'};});
        return Promise.resolve(st.getPurchases()).then(function(ps){
          return Promise.all((ps||[]).map(function(p){return verify(p).then(function(ok){if(ok)owned[p.productId]=true;});}));},function(){});
      }).then(function(){pay.isAvailable=pay.products.length>0;return pay;},function(){return off;});
    // never hold the game back for long because of the store
    return Promise.race([work,new Promise(function(res){setTimeout(function(){res(pay);},6000);})]);
  }
  var s=document.createElement('script');s.async=true;s.src='https://games.pikabu.ru/sdk/sdk.js';
  s.onload=function(){try{Promise.resolve(window.PkbSDK.init()).then(function(sdk){
      // loading-screen ad (mobile only, must come before gameStarted)
      var pre=sdk.ads&&sdk.ads.preloader;
      Promise.resolve(pre&&pre.isSupported!==false?pre.canShow():false).then(function(ok){return ok?pre.show():null;}).catch(function(){})
        .then(function(){return store(sdk);}).then(function(pay){ready(make(sdk,pay));});
    }).catch(function(){});}catch(e){}};
  document.head.appendChild(s);
})();
</script>
